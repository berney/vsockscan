[package]
name = "vsockscan"
version = "0.1.0"
edition = "2021"
description = "Guest-side AF_VSOCK recon: device presence, CID resolution, two-direction reachability sweep, listener census"
license = "MIT"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color"] }
anstyle = "1"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
