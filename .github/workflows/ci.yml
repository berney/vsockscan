name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned; Dependabot keeps refs current (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          # .cargo/config.toml sets a repo-wide musl build target; std for it
          # must be installed or clippy/test fail with E0463 on gnu-only runners.
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The same hooks a commit runs locally. gitleaks is skipped: under
  # --all-files it scans nothing, so in CI it only costs a Go build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
