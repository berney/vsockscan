version: 2
updates:
  # Bumps the SHA pins in .github/workflows/* (labels carry the semantic version).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Bumps the SHA-pinned hook revs in .pre-commit-config.yaml and their `# frozen:` comments.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
